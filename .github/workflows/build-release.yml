name: Build & Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create Release Package
        run: |
          $distDir = "AFCR_Timesheet_Release"
          New-Item -ItemType Directory -Path $distDir -Force
          Copy-Item "app.py" $distDir
          Copy-Item "ocr_engine.py" $distDir
          Copy-Item "storage.py" $distDir
          Copy-Item "config.py" $distDir
          Copy-Item "utils.py" $distDir
          Copy-Item "updater.py" $distDir
          Copy-Item "launcher.py" $distDir
          Copy-Item "RunWindows.bat" $distDir
          Copy-Item "create_shortcut.py" $distDir
          Copy-Item "codes.json" $distDir
          Copy-Item "requirements.txt" $distDir
          Copy-Item "static" "$distDir/static" -Recurse
          Copy-Item "templates" "$distDir/templates" -Recurse
          Compress-Archive -Path "$distDir/*" -DestinationPath "AFCR_Timesheet_v${{ github.ref_name }}_Windows.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AFCR_Timesheet_v${{ github.ref_name }}_Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true

